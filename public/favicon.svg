<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Vision Grid">
  <title>Vision Grid</title>
  <!--
    The app mark, using the exact geometry of LogoDiamond in src/icons.tsx, so
    the browser tab and the top-bar logo are the same drawing.

    The only change from the component is the colour: currentColor has nothing
    to inherit from in a favicon, so the accent gold is written in literally.
    Everything else matches svgProps() - 24x24 box, 2px stroke, round caps and
    joins, no fill.

    Careful with comments in here: a literal double hyphen is illegal inside an
    XML comment and makes the whole file fail to parse as an image.
  -->
  <g fill="none" stroke="#f0b429" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5L21.5 12 12 21.5 2.5 12z"/>
    <path d="M12 8l4 4-4 4-4-4z"/>
  </g>
</svg>
